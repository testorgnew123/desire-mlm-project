# Per-PR ephemeral Neon database branch, wired to the matching Netlify
# deploy preview -- PROGRESS.md Phase 0 "Neon DB branch per PR".
#
# On PR open/sync: create (or reset) a Neon branch off the primary branch,
# apply migrations to it, and point that PR's Netlify deploy preview at it
# via a branch-scoped env var override.
#
# On PR close: delete the Neon branch and the branch-scoped override, so
# neither accumulates across closed PRs.
#
# --filter @desire/web is REQUIRED, not cosmetic: this is a pnpm workspace with
# four packages, and without it the CLI stops with "Projects detected: ..." and
# exits 1 before touching anything. It cannot prompt on a runner.
#
# WHY THE CLI RATHER THAN raw curl: an earlier draft called Netlify's REST
# API directly and passed the SITE id where the path wants the ACCOUNT id
# (`/api/v1/accounts/{account_id}/env/{key}` -- confirmed by introspecting
# `netlify api setEnvVarValue`, which reports `account_id` and `key` as the
# required path variables). `netlify env:set --context branch:<name>` does
# the same job through a supported, maintained path that resolves the account
# itself, so there is no hand-derived API shape to drift out of date.
#
# Secrets required:
#   NEON_API_KEY, NEON_PROJECT_ID  -- Neon console
#   NETLIFY_AUTH_TOKEN             -- Netlify UI > User settings > Applications
#                                     > Personal access tokens. MANUAL: Netlify
#                                     has no API to mint one.
#   NETLIFY_SITE_ID                -- this site's project id

name: Neon preview branch

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: neon-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}

# The repository's default workflow token is read-only (verified:
# actions/permissions/workflow reports default_workflow_permissions=read), so
# the PR-comment step 403s without this. Granted at job level and narrowly:
# contents to check out, pull-requests to comment. Nothing else.
jobs:
  create-or-update:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create or reset the Neon branch for this PR
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          database: neondb
          # `username`, NOT `role`. create-branch-action@v5 declares username
          # as a REQUIRED input and has no `role` input at all (checked against
          # the action's own action.yml), so the previous spelling passed an
          # unknown key while omitting a required one.
          username: neondb_owner

      # corepack before setup-node: `cache: pnpm` shells out to pnpm, which is
      # not on ubuntu-latest. Same bug that had ci.yml failing on every commit.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # engineType="client" generates into packages/db/src/generated/, which is
      # gitignored -- every environment must generate explicitly. Same reason
      # ci.yml has this step.
      - name: Generate Prisma Client
        run: pnpm --filter @desire/db exec prisma generate

      # The branch clones the parent's schema at creation, but a PR that ADDS a
      # migration needs it applied before the preview can use the branch.
      - name: Apply migrations to the preview branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @desire/db exec prisma migrate deploy

      # `branch:<git branch>` scopes these to THIS PR's deploy preview only.
      # The context parameter is the PR's head branch (the branch Netlify
      # actually builds), not the Neon branch name -- two unrelated strings.
      - name: Point the Netlify preview at this Neon branch
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
          DB_URL_POOLED: ${{ steps.neon.outputs.db_url_with_pooler }}
          DB_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest env:set DATABASE_URL "$DB_URL_POOLED" \
            --context "branch:$GIT_BRANCH" --site "$SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --filter @desire/web --force
          npx --yes netlify-cli@latest env:set DATABASE_URL_UNPOOLED "$DB_URL_UNPOOLED" \
            --context "branch:$GIT_BRANCH" --site "$SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --filter @desire/web --force

      - name: Comment the branch details on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const branch = `preview/pr-${context.payload.pull_request.number}`;
            const body = `**Neon preview branch:** \`${branch}\`\n\nThis PR's Netlify deploy preview is wired to its own database branch, migrated to the current schema. Closing the PR deletes both automatically.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deletes resources only -- no checkout, no comment, so nothing beyond the
    # default read is needed. Stated rather than inherited so a future repo-wide
    # default of write does not silently widen it.
    permissions:
      contents: read
    steps:
      # delete-branch-action takes an id, not a name, so resolve it first.
      # Tolerates the branch already being gone (a re-run, or manual deletion).
      - name: Look up the Neon branch id
        id: lookup
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BRANCH_NAME: ${{ env.NEON_BRANCH_NAME }}
        run: |
          set -euo pipefail
          ID=$(curl -sS -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            | python3 -c "import json,sys,os; d=json.load(sys.stdin); name=os.environ['BRANCH_NAME']; m=[b['id'] for b in d.get('branches',[]) if b.get('name')==name]; print(m[0] if m else '')")
          echo "branch_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Delete the Neon branch
        if: steps.lookup.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_id: ${{ steps.lookup.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # Leaving these behind would point a future branch of the same name at a
      # database that no longer exists. `|| true` because the override may
      # legitimately not exist (PR closed before the create job ever ran).
      - name: Remove the Netlify branch-scoped override
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for key in DATABASE_URL DATABASE_URL_UNPOOLED; do
            npx --yes netlify-cli@latest env:unset "$key" \
              --context "branch:$GIT_BRANCH" --site "$SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --filter @desire/web --force || true
          done

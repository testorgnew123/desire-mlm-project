# Per-PR ephemeral Neon database branch, wired to the matching Netlify
# deploy preview -- PROGRESS.md Phase 0 "Neon DB branch per PR".
#
# On PR open/sync: create (or reuse) a Neon branch off the primary branch,
# apply migrations to it, and point that PR's Netlify deploy preview at it
# via a branch-scoped env var override (Netlify's `context: "branch"` +
# `context_parameter: <git branch name>` -- verified against Netlify's
# OpenAPI spec before building this, not assumed).
#
# On PR close: delete the Neon branch and the branch-scoped override, so
# neither accumulates indefinitely across closed PRs.
#
# Secrets required (see PROGRESS.md decision log for how each was obtained):
#   NEON_API_KEY, NEON_PROJECT_ID   -- Neon org "ankit", project desire-mlm
#   NETLIFY_AUTH_TOKEN              -- Personal Access Token (manual step --
#                                      Netlify has no API to mint one)
#   NETLIFY_SITE_ID                 -- this site's project id

name: Neon preview branch

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: neon-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  create-or-update:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or reset the Neon branch for this PR
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          database: neondb
          role: neondb_owner

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Applies the current migration set to the FRESH branch. The branch is
      # cloned from the parent's data+schema at creation time, but a PR that
      # itself adds a migration needs it applied before the preview can use it.
      - name: Apply migrations to the preview branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @desire/db exec prisma migrate deploy

      # Points this PR's Netlify deploy preview at the PR's own Neon branch --
      # context "branch" + context_parameter is the git branch name Netlify's
      # deploy-preview build actually runs on (the PR's head branch), not the
      # Neon branch name above (a separate, unrelated string).
      - name: Point the Netlify preview at this Neon branch
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
          DB_URL_POOLED: ${{ steps.neon.outputs.db_url_pooled }}
          DB_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: |
          set -euo pipefail
          for pair in "DATABASE_URL:$DB_URL_POOLED" "DATABASE_URL_UNPOOLED:$DB_URL_UNPOOLED"; do
            key="${pair%%:*}"
            value="${pair#*:}"
            curl -sS -X PATCH \
              "https://api.netlify.com/api/v1/accounts/${SITE_ID}/env/${key}" \
              -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"context\":\"branch\",\"context_parameter\":\"${GIT_BRANCH}\",\"value\":\"${value}\"}" \
              -o /dev/null -w "  %{http_code} setEnvVarValue ${key}\n"
          done

      - name: Comment the branch details on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const branch = `preview/pr-${context.payload.pull_request.number}`;
            const body = `**Neon preview branch:** \`${branch}\`\n\nThis PR's Netlify deploy preview is wired to its own database branch, migrated to the current schema. Closing the PR deletes both automatically.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Look up the branch id (delete-branch-action needs an id, not a name)
        id: lookup
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ID=$(curl -sS -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            | python3 -c "import json,sys,os; d=json.load(sys.stdin); name=os.environ['BRANCH_NAME']; m=[b['id'] for b in d.get('branches',[]) if b.get('name')==name]; print(m[0] if m else '')")
          echo "branch_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Delete the Neon branch
        if: steps.lookup.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_id: ${{ steps.lookup.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Remove the Netlify branch-scoped override
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for key in DATABASE_URL DATABASE_URL_UNPOOLED; do
            curl -sS -X DELETE \
              "https://api.netlify.com/api/v1/accounts/${SITE_ID}/env/${key}/value?context=branch&context_parameter=${GIT_BRANCH}" \
              -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
              -o /dev/null -w "  %{http_code} deleteEnvVarValue ${key}\n" || true
          done

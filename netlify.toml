# Netlify build config for the pnpm-workspace monorepo.
#
# `base` points Netlify at the Next.js app's own directory so the Next.js
# Runtime v5 (OpenNext adapter) auto-detects it correctly for SSR/function
# wrapping. `command` immediately steps back to the workspace root to do a
# workspace-aware `pnpm install` (apps/web alone can't resolve its
# `workspace:*` dependencies on @desire/db etc.), then builds just this app
# via turbo/pnpm filter.
#
# `publish` IS set, deliberately, despite Netlify's docs suggesting the
# Next.js Runtime v5 can auto-detect it: omitting it here produced a doubled,
# broken path (base + a wrong default = apps/web/apps/web/.next), confirmed
# by a failed deploy. Setting it explicitly, relative to `base`, avoids that.
[build]
  base = "apps/web"
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @desire/web build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify build config for the pnpm-workspace monorepo.
#
# `base` points Netlify at the Next.js app's own directory so the Next.js
# Runtime v5 (OpenNext adapter) auto-detects it correctly for SSR/function
# wrapping. `command` immediately steps back to the workspace root to do a
# workspace-aware `pnpm install` (apps/web alone can't resolve its
# `workspace:*` dependencies on @desire/db etc.), then builds just this app
# via turbo/pnpm filter.
#
# `publish` IS set, deliberately, despite Netlify's docs suggesting the
# Next.js Runtime v5 can auto-detect it: omitting it here produced a doubled,
# broken path (base + a wrong default = apps/web/apps/web/.next), confirmed
# by a failed deploy. Setting it explicitly, relative to `base`, avoids that.
#
# `prisma generate` is run EXPLICITLY, not left to a postinstall hook: plain
# `pnpm --filter @desire/web build` does not trigger packages/db's own build
# step (that's Turbo's `dependsOn: ["^build"]` behaviour, not plain pnpm
# --filter), and @prisma/client's postinstall generation is unreliable in a
# pnpm-workspace monorepo where schema.prisma isn't at a conventional root
# path. Confirmed by a real deploy failing with "@prisma/client did not
# initialize yet" before this was added.
# `migrate-on-deploy.sh` applies pending Prisma migrations BEFORE the app is
# built, on production builds only (CONTEXT=production). Netlify publishes a
# build only once it has finished, so the schema is always in place before the
# code that reads it goes live; merging used to publish the code with nothing
# migrating the database (PR 8: sign-ins failed for a few minutes). A preview is
# skipped -- it has its own Neon branch, migrated by neon-preview-branches.yml --
# and a production build with no DATABASE_URL_UNPOOLED FAILS rather than skips.
[build]
  base = "apps/web"
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @desire/db exec prisma generate && sh packages/db/scripts/migrate-on-deploy.sh && pnpm --filter @desire/web build"
  publish = ".next"
  # `base = apps/web` makes Netlify's default change-detection only look at
  # files inside that folder -- a real deploy was silently SKIPPED
  # ("Canceled build due to no content change") after a commit that only
  # touched packages/db/prisma/schema.prisma, which apps/web depends on but
  # sits outside base. `ignore = "exit 1"` disables that heuristic entirely
  # (exit 1 = never skip), which is correct for a monorepo where the app
  # depends on sibling workspace packages Netlify's default check can't see.
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "22"

# ── Canonical host ────────────────────────────────────────────────────────
#
# The .netlify.app hostname stays live forever and does NOT pass through
# Cloudflare, so every edge protection on crm.desirerealty.in -- the
# anonymous-root redirect, and any WAF or rate limiting added later -- is one
# hostname away from being skipped. That URL is also printed in this public
# repository, so it is not obscure.
#
# These rules are host-scoped: they match ONLY when the Host header is
# desire-mlm-project.netlify.app. Traffic to crm.desirerealty.in and to
# deploy previews (deploy-preview-N--...) has a different Host and is
# untouched.
#
# ORDER MATTERS -- Netlify applies the first matching rule.

# /api/* is deliberately exempt. The scheduled jobs POST to
# ${APP_BASE_URL}/api/jobs/* with `curl` that does NOT pass -L and treats
# anything other than 200 as a failure (.github/workflows/scheduled-jobs.yml).
# If APP_BASE_URL still holds the .netlify.app host, a 301 here would silently
# kill hold expiry, the collections sweep, grade qualification, the invariant
# monitor AND the nightly backup -- the only DR mechanism this project has.
# A same-path 200 rewrite serves the route normally and keeps that safe
# regardless of which host the secret holds.
#
# Once APP_BASE_URL is confirmed to be https://crm.desirerealty.in, this
# exemption can be deleted so API traffic is canonicalised too.
[[redirects]]
  from = "https://desire-mlm-project.netlify.app/api/*"
  to = "/api/:splat"
  status = 200
  force = true

# Everything else on the bare Netlify host goes to the real domain.
#
# 302, not 301, despite "canonical host" sounding permanent. A 301 is cached
# by browsers more or less forever: it would poison every developer's browser
# against the .netlify.app host, which is exactly the host you want reachable
# when Cloudflare or the custom domain is the thing being debugged. There is
# also no SEO argument to trade against that -- the whole app is behind a
# login and is not indexed. If the Netlify site is ever renamed, this host
# disappears anyway.
[[redirects]]
  from = "https://desire-mlm-project.netlify.app/*"
  to = "https://crm.desirerealty.in/:splat"
  status = 302
  force = true
